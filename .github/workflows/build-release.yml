name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.0.0），留空则用日期版本'
        required: false
        default: ''

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: See.Net.sln
  CSPROJ: See.Net/See.Net.csproj
  PROJECT_NAME: See.Net
  RUNTIME: win-x64

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码（完整历史，供生成发布说明 / delta）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $manual = "${{ inputs.version }}"
          if ($tag -match '^v(.+)$') {
            $v = $Matches[1]
          } elseif ($manual) {
            $v = $manual
          } else {
            $v = (Get-Date).ToString("0.0.0-yyMMddHHmm")
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "版本号: $v"

      - name: 安装工作负载与还原
        shell: pwsh
        run: |
          dotnet restore ${{ env.SOLUTION }}

      - name: 运行测试
        shell: pwsh
        run: |
          dotnet test ${{ env.SOLUTION }} -c Release --no-restore --nologo

      - name: 发布框架依赖单文件版本（不打包 .NET，安装器负责装运行时）
        shell: pwsh
        run: |
          dotnet publish ${{ env.CSPROJ }} `
            -c Release `
            -r ${{ env.RUNTIME }} `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o artifacts/publish `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: 清理发布目录（移除 XML 文档等冗余文件）
        shell: pwsh
        run: |
          Get-ChildItem artifacts/publish -Filter "*.xml" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force
          # 确认关键文件存在
          if (-not (Test-Path "artifacts/publish/See.exe")) { throw "See.exe 未生成" }
          if (-not (Test-Path "artifacts/publish/webassets")) { throw "webassets 目录缺失" }
          $mb = [math]::Round(((Get-ChildItem artifacts/publish -Recurse -File | Measure-Object Length -Sum).Sum)/1MB,2)
          echo "发布目录大小: $mb MB"

      - name: 生成发布说明（自上一 tag 的提交记录）
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          "## See $version" | Set-Content RELEASE_NOTES.md
          $prev = ""
          # 用管道捕获 stdout 而非依赖 $LASTEXITCODE（浅克隆/无上一 tag 时 describe 会失败，属正常）
          git describe --tags --abbrev=0 "${{ github.sha }}~1" 2>$null | ForEach-Object { $prev = $_ }
          if ($prev) {
            git log --oneline "$prev..${{ github.sha }}" | Add-Content RELEASE_NOTES.md
          } else {
            "" | Add-Content RELEASE_NOTES.md
          }
          exit 0

      - name: 安装 vpk CLI（与 NuGet 包 Velopack 版本一致）
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          dotnet tool list -g | Select-String vpk

      - name: 下载上一 Velopack 版本（用于生成 delta 增量包）
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { Write-Host "未找到上一 Velopack 版本，跳过 delta（首次发布属正常）" }

      - name: vpk 打包（安装包 + full/delta 更新包 + Portable.zip + 更新清单）
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          vpk pack `
            -u "See" `
            -v ${{ steps.ver.outputs.version }} `
            -r win-x64 `
            -p artifacts/publish `
            -o artifacts/velopack `
            -e See.exe `
            --packTitle "See" `
            --packAuthors "Fireneb-炎序星图" `
            -i packaging/assets/app.ico `
            --framework net10-x64-desktop `
            --releaseNotes RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "vpk pack 失败" }
          if (-not (Test-Path "artifacts/velopack/See-win-Setup.exe")) { throw "Velopack 安装包未生成" }
          Get-ChildItem artifacts/velopack -File | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: 发布到 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack `
            --publish `
            --releaseName "See ${{ steps.ver.outputs.version }}" `
            --tag ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { throw "vpk upload 失败" }

      - name: 上传构建产物（供 workflow_dispatch 手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: See-${{ steps.ver.outputs.version }}
          path: artifacts/velopack/**
          retention-days: 30

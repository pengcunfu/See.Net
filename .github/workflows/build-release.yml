name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.0.0），留空则用日期版本'
        required: false
        default: ''

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: See.Net.sln
  CSPROJ: See.Net/See.Net.csproj
  PROJECT_NAME: See.Net
  RUNTIME: win-x64

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 确定版本号
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $manual = "${{ inputs.version }}"
          if ($tag -match '^v(.+)$') {
            $v = $Matches[1]
          } elseif ($manual) {
            $v = $manual
          } else {
            $v = (Get-Date).ToString("0.0.0-yyMMddHHmm")
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "版本号: $v"

      - name: 安装工作负载与还原
        shell: pwsh
        run: |
          dotnet restore ${{ env.SOLUTION }}

      - name: 运行测试
        shell: pwsh
        run: |
          dotnet test ${{ env.SOLUTION }} -c Release --no-restore --nologo

      - name: 发布自包含版本
        shell: pwsh
        run: |
          dotnet publish ${{ env.CSPROJ }} `
            -c Release `
            -r ${{ env.RUNTIME }} `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o artifacts/publish `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: 清理发布目录（移除 XML 文档等冗余文件）
        shell: pwsh
        run: |
          Get-ChildItem artifacts/publish -Filter "*.xml" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force
          # 确认关键文件存在
          if (-not (Test-Path "artifacts/publish/See.exe")) { throw "See.exe 未生成" }
          if (-not (Test-Path "artifacts/publish/webassets")) { throw "webassets 目录缺失" }
          $mb = [math]::Round(((Get-ChildItem artifacts/publish -Recurse -File | Measure-Object Length -Sum).Sum)/1MB,2)
          echo "发布目录大小: $mb MB"

      - name: 打包绿色版 ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $zip = "artifacts/See.Net-$version-portable-x64.zip"
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath $zip -CompressionLevel Optimal
          echo "zip_path=$zip" >> $env:GITHUB_OUTPUT
          echo "zip_mb=$([math]::Round((Get-Item $zip).Length/1MB,2)) MB"

      - name: 编译 Inno Setup 安装包
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "未找到 Inno Setup 6: $iscc" }
          & $iscc packaging/inno/setup.iss `
            "/DSourceDir=$env:GITHUB_WORKSPACE\artifacts\publish" `
            "/DVersion=$version" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts" `
            "/DRepoRoot=$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败" }
          $setup = "artifacts/See.Net-$version-Setup.exe"
          if (-not (Test-Path $setup)) { throw "安装包未生成: $setup" }
          echo "setup_mb=$([math]::Round((Get-Item $setup).Length/1MB,2)) MB"

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: 上传构建产物（供下载）
        uses: actions/upload-artifact@v4
        with:
          name: See.Net-${{ steps.ver.outputs.version }}
          path: |
            artifacts/See.Net-${{ steps.ver.outputs.version }}-Setup.exe
            artifacts/See.Net-${{ steps.ver.outputs.version }}-portable-x64.zip
          retention-days: 30

      - name: 发布到 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: See.Net ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/See.Net-${{ steps.ver.outputs.version }}-Setup.exe
            artifacts/See.Net-${{ steps.ver.outputs.version }}-portable-x64.zip

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 预览</title>
<!-- 样式与 /data 均在 see-md.local（绝对地址）；相对图片走 <base> → mdcontent.local -->
<link rel="stylesheet" href="https://see-md.local/markdown.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #fff;
  }
  #status {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #666; font-size: 14px; gap: 8px;
  }
  #status.error { color: #b91c1c; white-space: pre-wrap; padding: 24px; text-align: center; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid #d1d5db; border-top-color: #2563eb;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="status"><div class="spinner"></div><span>正在渲染…</span></div>
<div id="container"></div>

<script>
(function () {
  "use strict";

  var statusEl = document.getElementById("status");
  var container = document.getElementById("container");

  function reportError(message) {
    try {
      window.chrome.webview.postMessage({ type: "error", message: String(message) });
    } catch (_) { /* 宿主可能已释放 */ }
    statusEl.className = "error";
    statusEl.textContent = "渲染失败：" + message;
  }

  // md 所在目录映射为 mdcontent.local；必须在 fetch 之前设好，但 fetch 要用绝对 URL
  var tag = document.createElement("base");
  tag.href = "https://mdcontent.local/";
  document.head.appendChild(tag);

  fetch("https://see-md.local/data", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("拉取渲染结果失败（HTTP " + res.status + "）");
      return res.text();
    })
    .then(function (html) {
      container.innerHTML = html;
      statusEl.style.display = "none";
    })
    .catch(function (err) {
      reportError(err && err.message ? err.message : err);
    });
})();
</script>
</body>
</html>
